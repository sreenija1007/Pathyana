# ============================================================
# Pathyana — application configuration
# ============================================================
# Everything sensitive is loaded from environment variables.
# Never commit real secrets to this file.
# ============================================================

spring.application.name=pathyana-backend
server.port=8080

# ---------- Database ----------
# Matches the Docker container from Phase 0:
#   docker run --name pathyana-pg ... -e POSTGRES_DB=pathyana_db ...
spring.datasource.url=jdbc:postgresql://localhost:5432/pathyana_db
spring.datasource.username=pathyana
spring.datasource.password=pathyana_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
# update = auto-add new tables/columns based on @Entity classes.
# Good for dev. We'll switch to Flyway migrations later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Groq (LLM provider) ----------
# Set GROQ_API_KEY in your shell:  export GROQ_API_KEY="gsk_..."
# If unset, the app still starts — calls will just fail with a clear error.
groq.api.key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.timeout-seconds=30

# ---------- Logging ----------
logging.level.com.pathyana=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{20}] %msg%n

# ---------- Mail (Gmail SMTP for verification emails) ----------
# Username and password come from environment variables (PATHYANA_MAIL_USERNAME, PATHYANA_MAIL_PASSWORD).
# The password must be a Gmail "app password" — regular Gmail passwords don't work for SMTP.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${PATHYANA_MAIL_USERNAME:}
spring.mail.password=${PATHYANA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# The "from" address shown on outgoing emails. For dev = your Gmail. For prod, change to a domain email.
pathyana.mail.from=${PATHYANA_MAIL_USERNAME:noreply@pathyana.local}

# Where to send the user when they click the verification link.
# For now = the backend itself. Later you'll change this to your frontend URL.
pathyana.app.base-url=http://localhost:8080

# ---------- JWT ----------
# Secret used to sign tokens. Must be 256+ bits (32+ characters). From env var.
pathyana.jwt.secret=${PATHYANA_JWT_SECRET:}

# Token lifetime in milliseconds. 86400000 = 24 hours.
pathyana.jwt.expiration-ms=86400000

# Issuer claim — identifies who minted the token. Useful for multi-service setups later.
pathyana.jwt.issuer=pathyana-backend